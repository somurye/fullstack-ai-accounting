        amount: { type: number, exclusiveMinimum: 0 }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        tax_category_id: { type: string, format: uuid, nullable: true }
        card_transaction_id: { type: string, format: uuid, nullable: true }
    ExpenseReportLineCreate:
      type: object
      required: [expense_date, category_id, amount, payment_method]
      properties:
        expense_date: { type: string, format: date }
        category_id: { type: string, format: uuid }
        description: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
        tax_category_id: { type: string, format: uuid }
        card_transaction_id: { type: string, format: uuid }
    ExpenseReportLineResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/ExpenseReportLine" }
        meta: { $ref: "#/components/schemas/Meta" }

    ExpenseReport:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        report_no: { type: string, readOnly: true }
        submitted_by: { type: string, format: uuid, readOnly: true }
        on_behalf_of: { type: string, format: uuid }
        purpose: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ExpenseReportStatus" }
        total_amount: { type: number, readOnly: true }
        journal_entry_id: { type: string, format: uuid, nullable: true, readOnly: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ExpenseReportLine" }
    ExpenseReportCreate:
      type: object
      required: [on_behalf_of, lines]
      properties:
        id:
          type: string
          format: uuid
          description: |
            省略可。レシートOCR機能でフロントエンドが撮影段階で事前生成したUUIDを指定すると、
            そのUUIDを対象にした`ai_suggestions`(target_type='expense_report')のOCR提案の
            target_idと、確定後の申請idが一致する。省略時はサーバー側で自動採番する。
        on_behalf_of:
          type: string
          format: uuid
          description: 代理申請の場合は費用が帰属する従業員のID。本人申請時は自身のID。
        purpose: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ExpenseReportLineCreate" }
