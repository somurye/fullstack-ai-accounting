  # ----------------------------------------------------------------------------
  # Payment Batches (全銀協FB出力)
  # ----------------------------------------------------------------------------
  /payment-batches:
    get:
      tags: [PaymentBatches]
      summary: 支払バッチ一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentBatchStatus" }
      responses:
        "200":
          description: 支払バッチ一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentBatchListResponse" }

  /payment-batches/{id}:
    get:
      tags: [PaymentBatches]
      summary: 支払バッチ詳細(明細含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 支払バッチ詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentBatchResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payment-batches/export-zengin:
    post:
      tags: [PaymentBatches]
      summary: 承認済みの支払対象(仕入請求書/経費立替金/給与)を集計し全銀協FBデータを生成する
      description: |
        対象明細はこの時点でスナップショットとして `payment_batch_items` に固定される
        (以後の請求書変更の影響を受けない)。生成後は `status=exported` となり、
        再生成不可(改版時は新バッチを作成する)。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_date, sources]
              properties:
                payment_date: { type: string, format: date }
                sources:
                  type: array
                  description: 支払対象の発生源を横断的に指定する(未指定項目は対象外)
                  items:
                    type: object
                    required: [source_type, source_id]
                    properties:
                      source_type:
                        type: string
                        enum: [vendor_bill, expense_reimbursement, payroll]
                      source_id: { type: string, format: uuid }
      responses:
        "201":
          description: 全銀協FBデータ生成成功(ダウンロードURLを含む)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaymentBatchResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PaymentBatch"
                          - type: object
                            properties:
                              download_url:
                                type: string
                                format: uri
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ----------------------------------------------------------------------------
  # Expense Reports (領域B)
  # ----------------------------------------------------------------------------
  /expense-reports:
    get:
      tags: [ExpenseReports]
      summary: 経費精算申請を検索する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ExpenseReportStatus" }
        - name: on_behalf_of
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 経費精算申請一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseReportListResponse" }
    post:
      tags: [ExpenseReports]
      summary: |
        経費精算を申請する(本人申請/代理申請)。
        申請と同時に先行draft仕訳が生成され、承認ルールが評価される。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseReportCreate" }
      responses:
        "201":
          description: 申請成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseReportResponse" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /expense-reports/ocr:
    post:
      tags: [ExpenseReports]
      summary: |
        レシート・領収書画像をVision AI(設定済みのAIプロバイダー)で解析し、取引情報を
        `ai_suggestions`(target_type='expense_report', suggestion_type='ocr')へ追記保存する。
        1枚の画像内に複数のレシート・領収書が写っている場合は、検出した数だけ個別の
        提案レコードを追記し、その数だけ`suggestions`配列の要素として返す。
        `expense_report_id`は既存申請への明細追加時はその申請id、新規申請作成中は
        `POST /expense-reports`にも渡す予定のUUIDを指定する。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, expense_report_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: 領収書・レシート画像(JPEG/PNG/PDF)
                expense_report_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: 抽出成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseReportOcrResultResponse" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /expense-reports/{id}:
    get:
      tags: [ExpenseReports]
      summary: 経費精算申請詳細(明細含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 経費精算申請詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseReportResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /expense-reports/{id}/lines:
    post:
      tags: [ExpenseReports]
      summary: 経費明細を追加する(交通費/出張旅費/日当等)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseReportLineCreate" }
      responses:
        "201":
          description: 追加成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseReportLineResponse" }

  # ----------------------------------------------------------------------------
  # Approval Requests (共通承認ワークフロー)
  # ----------------------------------------------------------------------------
  /approval-requests:
    get:
      tags: [ApprovalRequests]
      summary: 承認待ち・承認済みの申請を検索する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApprovalRequestStatus" }
        - name: target_type
          in: query
          schema:
            type: string
            enum: [journal_entry, expense_report, vendor_bill, contract, purchase_request]
        - name: pending_for_me
          in: query
          description: 現在のユーザーが次の承認ステップの承認者である申請のみに絞り込む
          schema: { type: boolean }
      responses:
        "200":
          description: 承認申請一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequestListResponse" }

  /approval-requests/{id}:
    get:
      tags: [ApprovalRequests]
      summary: 承認申請詳細(承認履歴含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 承認申請詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequestResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /approval-requests/{id}/approve:
    post:
      tags: [ApprovalRequests]
      summary: 承認する
      description: |
        申請者本人による承認(自己承認)は `SELF_APPROVAL_NOT_ALLOWED` エラーで
        409を返す(DB側 `fn_prevent_self_approval` トリガーによる最終防御)。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string }
      responses:
        "200":
          description: 承認成功(全ステップ完了時は対象リソースがposted/approvedへ遷移)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequestResponse" }
        "409":
          description: 自己承認、または既に完了した申請への操作
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                self_approval:
                  value:
                    success: false
                    error:
                      code: SELF_APPROVAL_NOT_ALLOWED
                      message: "申請者本人は承認者になれません"
                      details: []

  /approval-requests/{id}/reject:
    post:
      tags: [ApprovalRequests]
      summary: 却下する(対象リソースはdraft等へ差し戻される)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        "200":
          description: 却下成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequestResponse" }

  # ----------------------------------------------------------------------------
  # Recurring Journal Templates (定期仕訳)
  # ----------------------------------------------------------------------------
  /recurring-journal-templates:
    get:
      tags: [RecurringJournalTemplates]
      summary: 定期仕訳テンプレート一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
      responses:
        "200":
          description: 定期仕訳テンプレート一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournalTemplateListResponse" }
    post:
      tags: [RecurringJournalTemplates]
      summary: 定期仕訳テンプレートを作成する(家賃・リース料等の固定費自動起票)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringJournalTemplateCreate" }
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournalTemplateResponse" }

  /recurring-journal-templates/{id}:
    patch:
      tags: [RecurringJournalTemplates]
      summary: 定期仕訳テンプレートを更新する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringJournalTemplateCreate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringJournalTemplateResponse" }
    delete:
      tags: [RecurringJournalTemplates]
      summary: 定期仕訳テンプレートを無効化する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204": { description: 無効化成功 }

  /recurring-journal-templates/{id}/run:
    post:
      tags: [RecurringJournalTemplates]
      summary: テンプレートを手動起動し当月分のdraft仕訳を生成する(通常はバッチが自動実行)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "201":
          description: draft仕訳を生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryResponse" }

  # ----------------------------------------------------------------------------
  # Fixed Assets (領域C)
  # ----------------------------------------------------------------------------
  /fixed-assets:
    get:
      tags: [FixedAssets]
      summary: 固定資産台帳を検索する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/FixedAssetStatus" }
      responses:
        "200":
          description: 固定資産一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedAssetListResponse" }
    post:
      tags: [FixedAssets]
      summary: 固定資産を登録する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixedAssetCreate" }
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedAssetResponse" }

  /fixed-assets/{id}:
    get:
      tags: [FixedAssets]
      summary: 固定資産詳細(償却スケジュール含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 固定資産詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedAssetResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [FixedAssets]
      summary: 固定資産情報を更新する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixedAssetCreate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedAssetResponse" }

  /fixed-assets/{id}/dispose:
    post:
      tags: [FixedAssets]
      summary: 固定資産を除却・売却する(除却損/売却損益を自動仕訳)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposal_date, disposal_type]
              properties:
                disposal_date: { type: string, format: date }
                disposal_type: { type: string, enum: [disposed, sold] }
                proceeds_amount: { type: number, default: 0 }
      responses:
        "200":
          description: 除却・売却成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedAssetResponse" }

  /fixed-assets/depreciation-runs:
    post:
      tags: [FixedAssets]
      summary: 月次減価償却バッチを実行する(稼働中の全資産を対象にdraft仕訳を一括生成)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiscal_period_id]
              properties:
                fiscal_period_id: { type: string, format: uuid }
                asset_ids:
                  type: array
                  description: 未指定時は稼働中の全資産が対象
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: 償却バッチ実行結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data:
                    type: object
                    properties:
                      processed_count: { type: integer }
                      journal_entry_ids:
                        type: array
                        items: { type: string, format: uuid }

  # ----------------------------------------------------------------------------
  # Reports (試算表・財務三表)
  # ----------------------------------------------------------------------------
  /reports/trial-balance:
    get:
      tags: [Reports]
      summary: 試算表を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: fiscal_period_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 試算表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalanceResponse" }

  /reports/pl:
    get:
      tags: [Reports]
      summary: 損益計算書(PL)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: fiscal_year_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 損益計算書
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialStatementResponse" }

  /reports/bs:
    get:
      tags: [Reports]
      summary: 貸借対照表(BS)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: as_of_date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: 貸借対照表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialStatementResponse" }

  /reports/cash-flow:
    get:
      tags: [Reports]
      summary: キャッシュ・フロー計算書(CF)を取得する
      description: |
        確定済み仕訳(status='posted')のうち、現金及び現金同等物(現金・預金勘定)に
        影響を与える仕訳行を直接法で集計し、相手科目の区分(固定資産科目/純資産科目/その他)に
        基づき「営業活動」「投資活動」「財務活動」の3区分に分類する。
        期首残高 + 3区分合計 = 期末残高となり、貸借対照表の現金・預金残高と整合する。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: fiscal_year_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: キャッシュ・フロー計算書
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashFlowStatementResponse" }

  # ----------------------------------------------------------------------------
  # Dashboard (経営指標サマリー)
  # ----------------------------------------------------------------------------
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: ダッシュボード表示用の集計データを取得する
      description: |
        当月・前月のKPI(売上高/費用/純利益)、過去12ヶ月の月次損益推移、
        自分に割り当てられた承認待ち件数、直近5件のアクティビティ(経費精算・仕訳)を
        1回のリクエストでまとめて取得する。確定済み仕訳(status='posted')のみを集計対象とする。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: ダッシュボードサマリー
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummaryResponse" }

  # ----------------------------------------------------------------------------
  # Consumption Tax Returns (消費税申告)
  # ----------------------------------------------------------------------------
  /consumption-tax-returns:
    get:
      tags: [ConsumptionTaxReturns]
      summary: 消費税申告一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
      responses:
        "200":
          description: 消費税申告一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionTaxReturnListResponse" }
    post:
      tags: [ConsumptionTaxReturns]
      summary: |
        指定した会計年度・課税方式(本則/簡易/2割特例)で消費税申告データを新規作成し計算する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fiscal_year_id, filing_method]
              properties:
                fiscal_year_id: { type: string, format: uuid }
                filing_method: { $ref: "#/components/schemas/TaxFilingMethod" }
      responses:
        "201":
          description: 作成・計算成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionTaxReturnResponse" }

  /consumption-tax-returns/{id}:
    get:
      tags: [ConsumptionTaxReturns]
      summary: 消費税申告詳細(区分別内訳含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 消費税申告詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionTaxReturnResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /consumption-tax-returns/{id}/calculate:
    post:
      tags: [ConsumptionTaxReturns]
      summary: 最新の仕訳データに基づき税額を再計算する(draft状態のみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 再計算成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionTaxReturnResponse" }

  /consumption-tax-returns/{id}/finalize:
    post:
      tags: [ConsumptionTaxReturns]
      summary: 消費税申告を確定する(以後は追記専用)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 確定成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumptionTaxReturnResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ----------------------------------------------------------------------------
  # Payroll Imports (領域D)
  # ----------------------------------------------------------------------------
  /payroll-import-mappings:
    get:
      tags: [PayrollImports]
      summary: 給与CSV取込マッピング設定の一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: 給与CSV取込マッピング設定一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollImportMappingListResponse" }
    post:
      tags: [PayrollImports]
      summary: 給与CSV取込マッピング設定を作成する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollImportMappingCreate" }
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollImportMappingResponse" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /payroll-import-mappings/{id}:
    patch:
      tags: [PayrollImports]
      summary: 給与CSV取込マッピング設定を更新する(無効化はis_active:falseで表現する)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollImportMappingCreate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollImportMappingResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payroll-imports:
    get:
      tags: [PayrollImports]
      summary: 給与インポート履歴一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
      responses:
        "200":
          description: 給与インポート履歴一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollImportListResponse" }

  /payroll-imports/{id}:
    get:
      tags: [PayrollImports]
      summary: 給与インポート詳細(従業員別明細含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 給与インポート詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollImportResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payroll-imports/csv:
    post:
      tags: [PayrollImports]
      summary: |
        給与ソフトCSVを取込み、役員報酬/給与手当/預り金各種/法定福利費への
        複合仕訳(draft)を1トランザクションで自動生成する。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, import_mapping_id, pay_period_start, pay_period_end, payment_date]
              properties:
                file: { type: string, format: binary }
                import_mapping_id: { type: string, format: uuid }
                pay_period_start: { type: string, format: date }
                pay_period_end: { type: string, format: date }
                payment_date: { type: string, format: date }
      responses:
        "201":
          description: 取込・複合仕訳生成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollImportResponse" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /payroll-imports/{id}/post:
    post:
      tags: [PayrollImports]
      summary: 複合仕訳を確定する(accounting_managerによる最終承認が必須)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 確定成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollImportResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------------------------------
  # AI Suggestions (AI提案の隔離)
  # ----------------------------------------------------------------------------
  /ai/suggestions:
    get:
      tags: [AiSuggestions]
      summary: AI提案を検索する(確定データとは物理的に分離された領域)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: target_type
          in: query
          schema:
            type: string
            enum: [journal_entry, expense_report_line, bank_transaction, vendor_bill, expense_report, contract, attachment, purchase_request]
        - name: target_id
          in: query
          schema: { type: string, format: uuid }
        - name: suggestion_type
          in: query
          schema:
            type: string
            enum: [account_code, tax_category, reconciliation_match, anomaly_flag, ocr, contract_terms, generic_fields]
        - name: accepted
          in: query
          description: 未判定のみ取得する場合は指定しない
          schema: { type: boolean }
      responses:
        "200":
          description: AI提案一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestionListResponse" }

  /ai/suggestions/{id}:
    get:
      tags: [AiSuggestions]
      summary: AI提案詳細を取得する(候補データ・信頼度スコアを含む)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: AI提案詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ai/suggestions/{id}/accept:
    post:
      tags: [AiSuggestions]
      summary: |
        AI提案を採用する。この操作自体は確定処理ではなく、対象の
        草案(draft)レコードへ提案内容を反映する決定的ロジックをトリガーする
        (例: 提案された勘定科目コードを検証した上でjournal_entry_lines.account_idへ反映)。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 採用成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestionResponse" }
        "409":
          description: 対象レコードが既にdraft以外へ遷移しているため反映不可
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /ai/suggestions/{id}/reject:
    post:
      tags: [AiSuggestions]
      summary: AI提案を不採用にする
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: 不採用成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestionResponse" }

  # ----------------------------------------------------------------------------
  # Contracts (Phase 1: 総務・法務)
  # ----------------------------------------------------------------------------
  /contracts/extract-terms:
    post:
      tags: [Contracts]
      summary: 契約書添付ファイルからAI条項抽出を実行し、提案を隔離保存する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachment_id]
              properties:
                attachment_id: { type: string, format: uuid, description: "契約書PDFの添付ファイルID" }
                raw_text: { type: string, description: "抽出対象テキスト (省略時は添付ファイルから取得)" }
      responses:
        "200":
          description: AI条項抽出・提案保存成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /contracts:
    get:
      tags: [Contracts]
      summary: 契約書一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ContractStatus" }
        - name: contract_type
          in: query
          schema: { $ref: "#/components/schemas/ContractType" }
        - name: counterparty_name
          in: query
          schema: { type: string }
        - name: start_date_from
          in: query
          schema: { type: string, format: date }
        - name: start_date_to
          in: query
          schema: { type: string, format: date }
        - name: end_date_from
          in: query
          schema: { type: string, format: date }
        - name: end_date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 契約書一覧取得成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [Contracts]
      summary: 契約書をドラフト作成する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractCreate" }
      responses:
        "201":
          description: 契約書作成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /contracts/{id}:
    get:
      tags: [Contracts]
      summary: 契約書詳細を取得する (添付ファイル・承認履歴含む)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 契約書詳細取得成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [Contracts]
      summary: ドラフト契約書を更新する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractUpdate" }
      responses:
        "200":
          description: 契約書更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

    delete:
      tags: [Contracts]
      summary: ドラフト契約書を削除する (active後は削除不可)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204":
          description: 削除成功
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /contracts/{id}/submit-approval:
    post:
      tags: [Contracts]
      summary: 契約書の承認申請を起票する (1人テナント時は自動承認でactive化)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 申請成功 (または自動承認成功)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWTアクセストークン。`tenant_id` クレームを含み、`X-Tenant-ID` ヘッダーと
        一致しない場合はAPI層で403 (`TENANT_MISMATCH`) を返す。

  parameters:
    TenantIdHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: 操作対象テナントのUUID。JWTクレームの tenant_id と一致する必要がある。
      schema: { type: string, format: uuid }

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        副作用を伴うPOST操作の冪等性を保証するクライアント生成キー(推奨: UUID)。
        同一キーでの再送は最初のレスポンスをそのまま返す。
      schema: { type: string }

    IdPathParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }

    PageSizeParam:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: リクエストが不正です
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 認証に失敗しました(トークン欠落・無効・期限切れ)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 権限がありません(RBAC不足、またはX-Tenant-IDとJWTクレームの不一致)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: リソースが見つかりません(RLSにより越境アクセス時も同一の404を返す)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: 状態遷移ルール・DB制約違反等によりリクエストを実行できません
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnprocessableEntity:
      description: 入力値のバリデーションエラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:

    # ---- 共通エンベロープ ----
    Meta:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        pagination:
          type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total_count: { type: integer }
            total_pages: { type: integer }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            例: INVALID_BALANCE, VALIDATION_ERROR, NOT_FOUND, UNAUTHORIZED, FORBIDDEN,
            TENANT_MISMATCH, IDEMPOTENCY_KEY_CONFLICT, VOID_WINDOW_EXPIRED,
            SELF_APPROVAL_NOT_ALLOWED, DUPLICATE_IMPORT, CONFLICT, ALREADY_EXISTS,
            INVITATION_EXPIRED, INVITATION_REVOKED, INVITATION_ALREADY_ACCEPTED
        message: { type: string }
        details:
          type: array
          items: { type: object }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error: { $ref: "#/components/schemas/ApiError" }

    # ---- Enums (DBのENUM型と対応) ----
    AccountType:
      type: string
      enum: [asset, liability, equity, revenue, expense]
    DebitCredit:
      type: string
      enum: [debit, credit]
    JournalEntryStatus:
      type: string
      enum: [draft, pending_approval, posted, rejected, voided, reversed]
    InvoiceStatus:
      type: string
      enum: [draft, issued, partially_paid, paid, overdue, voided, credit_note_issued]
    VendorBillStatus:
      type: string
      enum: [draft, pending_approval, approved, rejected, scheduled_for_payment, paid]
    BankMatchStatus:
      type: string
      enum: [unmatched, auto_matched, manually_matched, reconciled, ignored]
    PaymentBatchStatus:
      type: string
      enum: [draft, exported, completed, cancelled]
    ExpenseReportStatus:
      type: string
      enum: [submitted, in_review, approved, rejected, reimbursement_scheduled, reimbursed]
    PaymentMethod:
      type: string
      enum: [cash, corporate_card, bank_transfer, employee_advance]
    ApprovalAction:
      type: string
      enum: [approve, reject]
    ApprovalRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    DepreciationMethod:
      type: string
      enum: [straight_line, declining_balance]
    FixedAssetStatus:
      type: string
      enum: [active, disposed, sold]
    TaxFilingMethod:
      type: string
      enum: [general, simplified, twenty_percent_special]
    TaxType:
      type: string
      enum: [taxable, non_taxable, exempt, out_of_scope]
    ContractType:
      type: string
      enum: [nda, service, lease, sales, outsourcing, license, employment, other]
    ContractStatus:
      type: string
      enum: [draft, pending_approval, active, rejected, expired, terminated]

    # ---- Auth (signup / invite) ----
    SignupRequest:
      type: object
      required: [email, password, name, tenant_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        name: { type: string, description: "ユーザー名" }
        tenant_name: { type: string, description: "会社/テナント名" }
    AuthSession:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        mfa_required: { const: false }
        tenants:
          type: array
          items:
            type: object
            properties:
              tenant_id: { type: string, format: uuid }
              tenant_name: { type: string }
    InvitationValidation:
      type: object
      properties:
        tenant_name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, accounting_manager, accountant, bookkeeper, approver, employee, payroll_admin, viewer_external, system_service, legal_admin, legal_viewer]
    AcceptInviteRequest:
      type: object
      required: [token, password, name]
      properties:
        token: { type: string, description: "招待メール/URLに含まれる生トークン" }
        password: { type: string, format: password, minLength: 8 }
        name: { type: string, description: "ユーザー名(既存アカウントに紐付く場合は無視される)" }

    # ---- Tenant / User ----
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        legal_name: { type: string }
        representative_name: { type: string, nullable: true, description: "代表者名" }
        address: { type: string, nullable: true, description: "所在地" }
        fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12 }
        invoice_registration_number: { type: string, nullable: true, description: "適格請求書発行事業者登録番号(T+数字13桁)" }
        consumption_tax_filing_method: { $ref: "#/components/schemas/TaxFilingMethod" }
        base_currency_code: { type: string, minLength: 3, maxLength: 3 }
        is_active: { type: boolean, readOnly: true }
    TenantSettingsUpdate:
      type: object
      properties:
        name: { type: string }
        legal_name: { type: string }
        representative_name: { type: string }
        address: { type: string }
        fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12 }
        invoice_registration_number:
          type: string
          nullable: true
          pattern: "^T\\d{13}$"
          description: "適格請求書発行事業者登録番号(T+数字13桁)"
        consumption_tax_filing_method: { $ref: "#/components/schemas/TaxFilingMethod" }
        base_currency_code: { type: string, minLength: 3, maxLength: 3 }
    TenantResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/Tenant" }
        meta: { $ref: "#/components/schemas/Meta" }

    AccountingSettings:
      type: object
      readOnly: true
      properties:
        rounding_rule:
          type: string
          enum: [floor, ceil, round]
          description: "端数処理ルール(floor=切り捨て/ceil=切り上げ/round=四捨五入)"
        default_tax_category_id: { type: string, format: uuid, nullable: true }
    AccountingSettingsUpdate:
      type: object
      properties:
        rounding_rule: { type: string, enum: [floor, ceil, round] }
        default_tax_category_id: { type: string, format: uuid, nullable: true }
    AccountingSettingsResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/AccountingSettings" }
        meta: { $ref: "#/components/schemas/Meta" }

    AiIntegrationSettings:
      type: object
      readOnly: true
      properties:
        provider:
          type: string
          nullable: true
          enum: [gemini, openai, anthropic]
        api_key_masked:
          type: string
          nullable: true
          description: "末尾4桁のみ表示するマスク済みAPIキー(例: \"••••1234\")。未設定時はnull"
        has_api_key: { type: boolean }
        last_tested_at: { type: string, format: date-time, nullable: true }
        last_test_result:
          type: string
          nullable: true
          enum: [success, failure]
    BankConnectorStatus:
      type: object
      readOnly: true
      properties:
        status:
          type: string
          enum: [not_connected, connected]
    IntegrationSettings:
      type: object
      readOnly: true
      properties:
        ai: { $ref: "#/components/schemas/AiIntegrationSettings" }
        bank_connector: { $ref: "#/components/schemas/BankConnectorStatus" }
    IntegrationSettingsResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/IntegrationSettings" }
        meta: { $ref: "#/components/schemas/Meta" }
    AiSettingsUpdate:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [gemini, openai, anthropic]
        api_key:
          type: string
          description: 省略時は既存のAPIキーを保持したままproviderのみ更新する
    AiIntegrationSettingsResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/AiIntegrationSettings" }
        meta: { $ref: "#/components/schemas/Meta" }
    AiConnectionTestResult:
      type: object
      readOnly: true
      properties:
        success: { type: boolean }
        message: { type: string }
        http_status: { type: integer, nullable: true }
    AiConnectionTestResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/AiConnectionTestResult" }
        meta: { $ref: "#/components/schemas/Meta" }

    TenantMember:
      type: object
      readOnly: true
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email, nullable: true }
        name: { type: string }
        employee_code: { type: string, nullable: true }
        department: { type: string, nullable: true }
        is_active: { type: boolean, description: "テナントへの所属自体が有効か(tenant_users.is_active)" }
        roles:
          type: array
          items:
            type: string
            enum: [owner, accounting_manager, accountant, bookkeeper, approver, employee, payroll_admin, viewer_external, system_service, legal_admin, legal_viewer]
    TenantMemberListResponse:
      type: object
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/TenantMember" }
        meta: { $ref: "#/components/schemas/Meta" }
    TenantMemberResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/TenantMember" }
        meta: { $ref: "#/components/schemas/Meta" }
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, accounting_manager, accountant, bookkeeper, approver, employee, payroll_admin, viewer_external, system_service, legal_admin, legal_viewer]

    MemberInvitation:
      type: object
      readOnly: true
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, accounting_manager, accountant, bookkeeper, approver, employee, payroll_admin, viewer_external, system_service, legal_admin, legal_viewer]
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    MemberInvitationCreate:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, accounting_manager, accountant, bookkeeper, approver, employee, payroll_admin, viewer_external, system_service, legal_admin, legal_viewer]
    MemberInvitationCreated:
      allOf:
        - $ref: "#/components/schemas/MemberInvitation"
        - type: object
          properties:
            token: { type: string, description: "招待の生トークン。このレスポンスでのみ返却される" }
            invite_url: { type: string, description: "招待受諾用URL(tokenをクエリパラメータに含む)" }
    MemberInvitationCreateResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/MemberInvitationCreated" }
        meta: { $ref: "#/components/schemas/Meta" }
    MemberInvitationListResponse:
      type: object
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/MemberInvitation" }
        meta: { $ref: "#/components/schemas/Meta" }
    MemberInvitationResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/MemberInvitation" }
        meta: { $ref: "#/components/schemas/Meta" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        email: { type: string, format: email }
        name: { type: string }
        is_active: { type: boolean }
        roles:
          type: array
          description: 現在のテナントにおけるロールコード一覧
          items:
            type: string
            enum: [owner, accounting_manager, accountant, bookkeeper, approver, employee, payroll_admin, viewer_external, system_service, legal_admin, legal_viewer]
    UserResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/User" }
        meta: { $ref: "#/components/schemas/Meta" }

    # ---- Attachments ----
    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        file_name: { type: string }
        storage_path: { type: string, readOnly: true }
        mime_type: { type: string }
        file_hash: { type: string, readOnly: true }
        document_category:
          type: string
          enum: [receipt, invoice, contract, purchase_order, other]
          description: 文書種別
        transaction_date: { type: string, format: date }
        amount: { type: number }
        counterparty_name: { type: string }
        uploaded_by: { type: string, format: uuid, readOnly: true }
        uploaded_at: { type: string, format: date-time, readOnly: true }
    AttachmentResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/Attachment" }
        meta: { $ref: "#/components/schemas/Meta" }
    AttachmentListResponse:
      type: object
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        meta: { $ref: "#/components/schemas/Meta" }

    # ---- Audit Logs ----
    AuditLog:
      type: object
      readOnly: true
      properties:
        id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid, nullable: true }
        actor_user_name: { type: string, nullable: true, description: "actor_user_id に対応するユーザー名(退会・システム動作時はnull)" }
        action: { type: string, description: "例: journal_entry.posted, invoice.issued" }
        target_type: { type: string }
        target_id: { type: string, format: uuid, nullable: true }
        target_name: { type: string, nullable: true, description: "target_type が user の場合のみ設定される対象ユーザー名" }
        before_data: { type: object, nullable: true }
        after_data: { type: object, nullable: true }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
    AuditLogListResponse:
      type: object
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
        meta: { $ref: "#/components/schemas/Meta" }

    # ---- External Access Grants ----
    ExternalAccessGrant:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        can_export: { type: boolean, default: false }
        granted_by: { type: string, format: uuid, readOnly: true }
        granted_at: { type: string, format: date-time, readOnly: true }
    ExternalAccessGrantCreate:
      type: object
      required: [user_id, valid_from, valid_until]
