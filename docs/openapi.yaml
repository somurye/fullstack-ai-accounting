openapi: 3.1.0

info:
  title: 経理・会計オールインワンAIアプリケーション API
  version: "1.0.0"
  description: |
    中小企業〜中堅企業向け「経理・会計をこのアプリ1つで完結させる」オールインワンAIプロダクトのAPI仕様。

    対応する統合DB設計は `docs/03_database_design.md` / `sql/001_initial_schema_all_in_one.sql` を参照。

    ## 設計原則
    - AIは提案(`/ai/suggestions`)のみを行い、確定処理(仕訳確定・税額計算等)は本APIの決定的ロジックが行う。
    - 状態遷移・業務アクションはサブリソース(例: `POST /journal-entries/{id}/post`)として明示する。
    - 全エンドポイントはマルチテナントであり、`X-Tenant-ID` ヘッダーとJWTクレームの双方で検証される。
    - 副作用を伴うPOST操作は `Idempotency-Key` ヘッダーによる冪等性をサポートする。
  contact:
    name: 経理会計オールインワンソフト開発チーム

servers:
  - url: https://api.keiri-kaikei.example.com/v1
    description: 本番環境
  - url: https://api.staging.keiri-kaikei.example.com/v1
    description: ステージング環境
  - url: http://localhost:3000/v1
    description: ローカル開発環境

tags:
  - name: Auth
    description: 認証・MFA
  - name: Tenants
    description: テナント情報
  - name: Users
    description: ユーザー情報
  - name: Settings
    description: 自社情報・会計処理設定・メンバー権限管理
  - name: Attachments
    description: 電子帳簿保存法対応の証憑ファイル管理
  - name: AuditLogs
    description: 追記専用監査ログ
  - name: ExternalAccessGrants
    description: 税理士・監査人向け時限アクセス管理
  - name: Accounts
    description: 勘定科目マスタ
  - name: TaxCategories
    description: 税区分マスタ
  - name: Departments
    description: 部門マスタ
  - name: JournalEntries
    description: 仕訳(会計の中核)
  - name: BankAccounts
    description: 銀行口座マスタ
  - name: BankTransactions
    description: 銀行明細・自動消込
  - name: AutoJournalRules
    description: 自動仕訳ルールエンジン
  - name: Customers
    description: 顧客マスタ
  - name: Vendors
    description: 仕入先マスタ
  - name: Invoices
    description: 売上請求書(Accounts Receivable)
  - name: VendorBills
    description: 仕入請求書/買掛金(Accounts Payable)
  - name: PaymentBatches
    description: 支払バッチ・全銀協FBデータ出力
  - name: ExpenseReports
    description: 経費精算・出張旅費
  - name: ApprovalRequests
    description: 多段階承認ワークフロー
  - name: RecurringJournalTemplates
    description: 定期仕訳テンプレート
  - name: FixedAssets
    description: 固定資産台帳・減価償却
  - name: Reports
    description: 試算表・財務三表
  - name: ConsumptionTaxReturns
    description: 消費税申告サポート
  - name: PayrollImports
    description: 給与連携
  - name: AiSuggestions
    description: AI提案の隔離領域
  - name: Dashboard
    description: ダッシュボード集計(KPIサマリー・月次推移・承認待ち・直近アクティビティ)
  - name: Contracts
    description: "契約書管理 (Phase 1: 総務・法務)"

security:
  - BearerAuth: []

# ==============================================================================
# PATHS
# ==============================================================================
paths:

  # ----------------------------------------------------------------------------
  # Auth
  # ----------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: メールアドレス・パスワードでログインする
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: ログイン成功。MFAが有効な場合は `mfa_required=true` とともに `mfa_token` を返す。
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      refresh_token: { type: string }
                      mfa_required: { type: boolean }
                      mfa_token: { type: string, description: "mfa_required=trueの場合のみ" }
                      tenants:
                        type: array
                        description: 所属テナント一覧(複数所属時はテナント選択が必要)
                        items:
                          type: object
                          properties:
                            tenant_id: { type: string, format: uuid }
                            tenant_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /auth/mfa:
    post:
      tags: [Auth]
      summary: MFA(多要素認証)コードを検証しアクセストークンを発行する
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string, description: "6桁のTOTPコード" }
      responses:
        "200":
          description: MFA検証成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      refresh_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: ログアウトし現在のリフレッシュトークンを失効させる
      responses:
        "204": { description: ログアウト成功 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/signup:
    post:
      tags: [Auth]
      summary: 初回サインアップ(新規テナント作成 + オーナーユーザー登録)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: サインアップ成功。作成されたテナントのオーナーとしてセッションを発行する
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data: { $ref: "#/components/schemas/AuthSession" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/invitations/validate:
    get:
      tags: [Auth]
      summary: 招待トークンの有効性を検証する
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 有効な招待。招待先のテナント名・メールアドレス・ロールを返す
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data: { $ref: "#/components/schemas/InvitationValidation" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/accept-invite:
    post:
      tags: [Auth]
      summary: 招待を受諾しテナントへ参加する(新規ユーザー作成、または既存ユーザーへの紐付け)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200":
          description: 招待受諾成功。参加したテナントのセッションを発行する
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data: { $ref: "#/components/schemas/AuthSession" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ----------------------------------------------------------------------------
  # Tenants / Users
  # ----------------------------------------------------------------------------
  /tenants/me:
    get:
      tags: [Tenants]
      summary: 現在のテナント情報を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: テナント情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/me:
    get:
      tags: [Users]
      summary: 現在ログイン中のユーザー情報と所属テナントでのロールを取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ----------------------------------------------------------------------------
  # Settings (自社情報 / 会計処理設定 / メンバー管理)
  # 外部時限アクセスの発行・失効・一覧は既存の `tags: [ExternalAccessGrants]`
  # (`/external-access-grants`)を設定画面からもそのまま利用する(重複実装を避けるため)。
  # ----------------------------------------------------------------------------
  /settings/tenant:
    get:
      tags: [Settings]
      summary: 自社(テナント)情報を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: 自社情報
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantResponse" }
    patch:
      tags: [Settings]
      summary: 自社(テナント)情報を更新する(owner/accounting_managerのみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettingsUpdate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /settings/accounting:
    get:
      tags: [Settings]
      summary: 会計処理共通設定を取得する(端数処理ルール・デフォルト税区分)
      description: 未設定のテナントにはデフォルト値(rounding_rule=floor, default_tax_category_id=null)を補完して返す。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: 会計処理設定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingSettingsResponse" }
    patch:
      tags: [Settings]
      summary: 会計処理共通設定を更新する(owner/accounting_managerのみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountingSettingsUpdate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingSettingsResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/integrations:
    get:
      tags: [Settings]
      summary: 外部連携設定(AIプロバイダ・銀行/決済コネクタ状態)を取得する(owner/accounting_managerのみ)
      description: |
        APIキーは平文では返却されず、末尾4桁以外をマスクした文字列(例: "••••1234")として返す。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: 取得成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSettingsResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/integrations/ai:
    patch:
      tags: [Settings]
      summary: AIプロバイダおよびAPIキー設定を更新する(owner/accounting_managerのみ)
      description: |
        `api_key` はAES-256-GCMで暗号化して保存され、平文は保持されない。`api_key` を省略した場合は
        既存のAPIキーを保持したまま `provider` のみを更新する(APIキー入力欄を変更していない場合に
        再送信不要にするため)。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsUpdate" }
      responses:
        "200":
          description: 更新成功(APIキーはマスクされた状態で返却)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiIntegrationSettingsResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/integrations/ai/test:
    post:
      tags: [Settings]
      summary: 設定済みAPIキーの導通テストを行う(owner/accounting_managerのみ)
      description: |
        保存済みのAIプロバイダ・APIキーを復号し、対象プロバイダへ実際に最小限のリクエスト
        (モデル一覧取得など、トークン課金の発生しないエンドポイント)を送信して疎通を確認する。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: |
            テスト実行結果(HTTPステータスは常に200。テスト自体の成否は `data.success` で判定する)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiConnectionTestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings/members:
    get:
      tags: [Settings]
      summary: テナント所属メンバー一覧(ロール含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: メンバー一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantMemberListResponse" }

  /settings/members/{userId}/role:
    patch:
      tags: [Settings]
      summary: メンバーのロールを変更する(owner権限のみ。最後の1人のownerは降格不可)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleUpdate" }
      responses:
        "200":
          description: 変更成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantMemberResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /settings/members/{userId}:
    delete:
      tags: [Settings]
      summary: メンバーをテナントから削除/アクセス停止する(owner権限のみ)
      description: |
        `tenant_users.is_active = false` へのフラグ更新(および当該ユーザーの
        `user_roles` 全削除)によりアクセスを遮断する。過去に作成した仕訳・経費申請・
        監査ログ等の参照整合性を保つため、`tenant_users` 行自体は物理削除しない。
        最後の1人のownerは削除不可。操作者自身は削除不可(離脱は別途対応)。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 削除(アクセス停止)成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantMemberResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /settings/members/invitations:
    get:
      tags: [Settings]
      summary: 招待中(未参加・有効期限内・未取消)の招待一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      responses:
        "200":
          description: 招待一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInvitationListResponse" }
    post:
      tags: [Settings]
      summary: メンバー招待を発行する(owner/accounting_managerのみ)
      description: |
        7日間有効な招待トークンを発行する。生トークンはこのレスポンスでのみ返却され、
        DBにはSHA-256ハッシュのみ保存される(refresh_tokensと同様の方針)。
        既に同一テナントに所属しているメールアドレス、または招待中のメールアドレスの
        場合は 409 ALREADY_EXISTS を返す。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInvitationCreate" }
      responses:
        "200":
          description: 発行成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInvitationCreateResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /settings/members/invitations/{invitationId}:
    delete:
      tags: [Settings]
      summary: メンバー招待を取り消す(owner/accounting_managerのみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInvitationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------------------------
  # Attachments (電帳法)
  # ----------------------------------------------------------------------------
  /attachments:
    get:
      tags: [Attachments]
      summary: "添付ファイルを検索する(電帳法検索要件: 取引年月日/金額/取引先)"
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: transaction_date_from
          in: query
          schema: { type: string, format: date }
        - name: transaction_date_to
          in: query
          schema: { type: string, format: date }
        - name: amount
          in: query
          schema: { type: number }
        - name: counterparty_name
          in: query
          schema: { type: string }
          description: 部分一致検索(pg_trgm)
        - name: document_category
          in: query
          schema:
            type: string
            enum: [receipt, invoice, contract, purchase_order, other]
          description: 文書種別による絞り込み
      responses:
        "200":
          description: 添付ファイル一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Attachments]
      summary: 証憑・文書ファイルをアップロードする
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                document_category:
                  type: string
                  enum: [receipt, invoice, contract, purchase_order, other]
                  default: receipt
                  description: "文書種別(未指定時はreceipt)"
                transaction_date: { type: string, format: date }
                amount: { type: number }
                counterparty_name: { type: string }
      responses:
        "201":
          description: アップロード成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /attachments/{id}:
    get:
      tags: [Attachments]
      summary: 添付ファイルのメタデータを取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 添付ファイル詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "404": { $ref: "#/components/responses/NotFound" }

  /attachments/{id}/content:
    get:
      tags: [Attachments]
      summary: "証憑の実ファイルをストリーム返却する(電帳法プレビュー/インライン表示用)"
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: "ファイル本体(Content-Type/Content-Disposition: inline は元ファイルに応じて設定)"
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /attachments/{id}/links:
    post:
      tags: [Attachments]
      summary: 添付ファイルを業務レコード(仕訳/経費明細/請求書等)へ関連付ける
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linkable_type, linkable_id]
              properties:
                linkable_type:
                  type: string
                  enum: [journal_entry, expense_report_line, invoice, vendor_bill, fixed_asset]
                linkable_id: { type: string, format: uuid }
      responses:
        "201": { description: 関連付け成功 }
        "409": { $ref: "#/components/responses/Conflict" }

  # ----------------------------------------------------------------------------
  # Audit Logs (追記専用)
  # ----------------------------------------------------------------------------
  /audit-logs:
    get:
      tags: [AuditLogs]
      summary: 監査ログを検索する(閲覧のみ。書き込みAPIは提供しない)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: target_type
          in: query
          schema:
            type: string
            enum:
              [
                journal_entry,
                expense_report,
                invoice,
                vendor_bill,
                bank_transaction,
                bank_account,
                payroll_import,
                fixed_asset,
                consumption_tax_return,
                payment_batch,
                external_access_grant,
                attachment,
                tenant,
                user,
              ]
        - name: target_id
          in: query
          schema: { type: string, format: uuid }
        - name: actor_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: actor_name
          in: query
          description: 操作者名の部分一致検索
          schema: { type: string }
        - name: keyword
          in: query
          description: 操作者名・対象名・対象IDのフリーワード部分一致検索
          schema: { type: string }
        - name: occurred_from
          in: query
          schema: { type: string, format: date-time }
        - name: occurred_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 監査ログ一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------------------------------
  # External Access Grants (税理士・監査人)
  # ----------------------------------------------------------------------------
  /external-access-grants:
