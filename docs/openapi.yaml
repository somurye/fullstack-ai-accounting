  # ----------------------------------------------------------------------------
  # Journal Entries (会計コア)
  # ----------------------------------------------------------------------------
  /journal-entries:
    get:
      tags: [JournalEntries]
      summary: 仕訳を検索する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/JournalEntryStatus" }
        - name: entry_date_from
          in: query
          schema: { type: string, format: date }
        - name: entry_date_to
          in: query
          schema: { type: string, format: date }
        - name: source_type
          in: query
          schema: { type: string }
        - name: account_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 仕訳一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [JournalEntries]
      summary: 仕訳を草案(draft)として作成する
      description: |
        AI提案・手動入力・他業務(経費精算等)からの起票いずれの場合も、
        まず draft として作成される。この時点では貸借一致は必須検証されない
        (貸借一致は `POST /journal-entries/{id}/post` 時に厳格検証される)。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryCreate" }
      responses:
        "201":
          description: 作成成功(draft)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryResponse" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /journal-entries/{id}:
    get:
      tags: [JournalEntries]
      summary: 仕訳詳細(明細含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 仕訳詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [JournalEntries]
      summary: 仕訳を編集する(draft状態のみ許可。posted以降はDBトリガーが拒否)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryUpdate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryResponse" }
        "409":
          description: draft以外の仕訳は編集不可
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /journal-entries/{id}/lines:
    get:
      tags: [JournalEntries]
      summary: 仕訳明細一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 仕訳明細一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryLineListResponse" }
    post:
      tags: [JournalEntries]
      summary: 仕訳明細を追加する(draft状態のみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryLineCreate" }
      responses:
        "201":
          description: 追加成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryLineResponse" }

  /journal-entries/{id}/lines/{lineId}:
    delete:
      tags: [JournalEntries]
      summary: 仕訳明細を削除する(draft状態のみ。DBトリガーによりそれ以外は拒否)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - name: lineId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 削除成功 }
        "409":
          description: draft以外の仕訳明細は削除不可
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /journal-entries/{id}/post:
    post:
      tags: [JournalEntries]
      summary: 仕訳を確定する(貸借一致をDBトリガーで検証)
      description: |
        貸借が一致しない場合は `INVALID_BALANCE` エラーで409を返す
        (DB側 `fn_check_journal_balance` トリガーによる最終防御)。
        承認ルールに該当する場合は先に `pending_approval` へ遷移し、
        全承認完了後に自動的に `posted` となる。
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 確定成功(またはpending_approvalへの遷移)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryResponse" }
        "409":
          description: 貸借不一致(INVALID_BALANCE)、または明細不足
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                invalid_balance:
                  value:
                    success: false
                    error:
                      code: INVALID_BALANCE
                      message: "借方合計と貸方合計が一致しません"
                      details: []

  /journal-entries/{id}/void:
    post:
      tags: [JournalEntries]
      summary: 仕訳を即時取消する(確定後24時間以内かつ未参照の場合のみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryResponse" }
        "409":
          description: 24時間超過、または他レコードから参照済みのため取消不可(VOID_WINDOW_EXPIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /journal-entries/{id}/reverse:
    post:
      tags: [JournalEntries]
      summary: 反対仕訳を起票する(24時間経過後、または既参照の仕訳の訂正手段)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                entry_date:
                  type: string
                  format: date
                  description: 未指定時は当日日付
      responses:
        "201":
          description: 反対仕訳(draft)を生成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntryResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

