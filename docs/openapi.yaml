        "200":
          description: 銀行明細一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransactionListResponse" }

  /bank-transactions/import-csv:
    post:
      tags: [BankTransactions]
      summary: 銀行明細CSVを取込む(重複はハッシュ照合で自動スキップ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, bank_account_id]
              properties:
                file: { type: string, format: binary }
                bank_account_id: { type: string, format: uuid }
                import_profile_id:
                  type: string
                  format: uuid
                  description: 列マッピングプロファイル(未指定時は銀行口座の既定プロファイル)
      responses:
        "200":
          description: 取込結果サマリー
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data:
                    type: object
                    properties:
                      imported_count: { type: integer }
                      duplicate_skipped_count: { type: integer }
                      auto_matched_count: { type: integer }
                      transactions:
                        type: array
                        items: { $ref: "#/components/schemas/BankTransaction" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /bank-transactions/{id}:
    get:
      tags: [BankTransactions]
      summary: 銀行明細詳細を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 銀行明細詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransactionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bank-transactions/{id}/match:
    post:
      tags: [BankTransactions]
      summary: 銀行明細を手動で消込先(請求書/仕入請求書/仕訳)に紐付ける
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type:
                  type: string
                  enum: [invoice, vendor_bill, journal_entry]
                target_id: { type: string, format: uuid }
      responses:
        "200":
          description: 消込成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankTransactionResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auto-journal-rules:
    get:
      tags: [AutoJournalRules]
      summary: 自動仕訳ルール一覧を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
