      type: object
      readOnly: true
      required: [confidence_score, model_name]
      properties:
        transaction_date: { type: string, format: date, nullable: true }
        amount: { type: number, nullable: true }
        vendor_name: { type: string, nullable: true }
        invoice_registration_number: { type: string, nullable: true }
        suggested_account_id: { type: string, format: uuid, nullable: true }
        confidence_score: { type: number, minimum: 0, maximum: 1 }
        model_name: { type: string }
    ExpenseReportOcrSuggestion:
      type: object
      readOnly: true
      required: [id, data]
      properties:
        id:
          type: string
          format: uuid
          description: 追記された `ai_suggestions` レコードのid
        data: { $ref: "#/components/schemas/ExpenseReportOcrSuggestionData" }
    ExpenseReportOcrResult:
      type: object
      readOnly: true
      required: [suggestions]
      properties:
        suggestions:
          type: array
          description: 画像内から検出されたレシート数ぶんの提案(1枚に複数のレシートが写っている場合は複数件)
          items: { $ref: "#/components/schemas/ExpenseReportOcrSuggestion" }
    ExpenseReportOcrResultResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/ExpenseReportOcrResult" }
        meta: { $ref: "#/components/schemas/Meta" }
