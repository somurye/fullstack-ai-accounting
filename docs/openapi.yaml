        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 提出成功(status=pending_approval、または承認不要な場合はapproved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorBillResponse" }

  /vendor-bills/{id}/payments:
