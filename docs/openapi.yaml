          application/json:
            schema: { $ref: "#/components/schemas/AutoJournalRuleCreate" }
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoJournalRuleResponse" }

  /auto-journal-rules/{id}:
    patch:
      tags: [AutoJournalRules]
      summary: 自動仕訳ルールを更新する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoJournalRuleCreate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoJournalRuleResponse" }
    delete:
      tags: [AutoJournalRules]
      summary: 自動仕訳ルールを無効化する(is_active=false。物理削除は行わない)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "204": { description: 無効化成功 }

