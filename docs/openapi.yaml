    # ---- Payroll Import Mappings ----
    PayrollImportColumnMapping:
      type: object
      description: 給与CSVのヘッダー名 -> 内部項目名 の対応(値は取込対象CSVの列見出し文字列)
      properties:
        employee_name: { type: string }
        employee_code: { type: string }
        executive_compensation_amount: { type: string }
        salary_amount: { type: string }
        withholding_tax_amount: { type: string }
        resident_tax_amount: { type: string }
        social_insurance_employee_amount: { type: string }
        social_insurance_company_amount: { type: string }
        net_payment_amount: { type: string }
    PayrollImportAccountMapping:
      type: object
      description: 給与項目 -> 計上先勘定科目ID の対応
      required:
        - net_payment_account_id
      properties:
        executive_compensation_account_id: { type: string, format: uuid, nullable: true }
        salary_account_id: { type: string, format: uuid, nullable: true }
        withholding_tax_account_id: { type: string, format: uuid, nullable: true }
        resident_tax_account_id: { type: string, format: uuid, nullable: true }
        social_insurance_employee_account_id: { type: string, format: uuid, nullable: true }
        social_insurance_company_expense_account_id:
          type: string
          format: uuid
          nullable: true
          description: 法定福利費(会社負担分・借方)
        social_insurance_company_payable_account_id:
          type: string
          format: uuid
          nullable: true
          description: 未払法定福利費(会社負担分・貸方)
        net_payment_account_id:
          type: string
          format: uuid
          description: 差引支給額の貸方科目(未払金/現金預金等)
    PayrollImportMapping:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        column_mapping: { $ref: "#/components/schemas/PayrollImportColumnMapping" }
        account_mapping: { $ref: "#/components/schemas/PayrollImportAccountMapping" }
        is_active: { type: boolean, default: true }
    PayrollImportMappingCreate:
      type: object
      required: [name, column_mapping, account_mapping]
      properties:
        name: { type: string }
        column_mapping: { $ref: "#/components/schemas/PayrollImportColumnMapping" }
        account_mapping: { $ref: "#/components/schemas/PayrollImportAccountMapping" }
        is_active: { type: boolean, default: true }
    PayrollImportMappingResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/PayrollImportMapping" }
        meta: { $ref: "#/components/schemas/Meta" }
    PayrollImportMappingListResponse:
      type: object
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/PayrollImportMapping" }
        meta: { $ref: "#/components/schemas/Meta" }

    # ---- AI Suggestions ----
    AiSuggestion:
      type: object
      readOnly: true
      properties:
        id: { type: string, format: uuid }
        target_type:
          type: string
          enum: [journal_entry, expense_report_line, bank_transaction, vendor_bill, expense_report, contract, attachment, purchase_request]
        target_id: { type: string, format: uuid }
        suggestion_type:
          type: string
          enum: [account_code, tax_category, reconciliation_match, anomaly_flag, ocr, contract_terms, generic_fields]
        payload:
          type: object
          description: |
            候補データ。例(account_code):
            {"suggested_account_code": "5000", "candidates": [{"code":"5000","score":0.92}]}
            例(ocr): {"transaction_date": "2026-08-01", "amount": 3300, "vendor_name": "…",
            "invoice_registration_number": "T1234567890123", "suggested_account_id": "…"}
            例(汎用/契約書): {"document_type": "contract", "suggested_fields": {"contract_title": {"value": "秘密保持契約書", "confidence": 0.95, "rationale": "表題より抽出"}}}
          properties:
            document_type: { type: string, description: "文書種別(contract, invoice, receipt, purchase_order等)" }
            suggested_fields:
              type: object
              description: 汎用構造化提案フィールド辞書
              additionalProperties:
                type: object
                properties:
                  value: { description: "抽出された値(文字列・数値・真偽値等)" }
                  confidence: { type: number, minimum: 0, maximum: 1, description: "信頼度スコア (0.0〜1.0)" }
                  rationale: { type: string, description: "推論根拠・抽出元テキスト" }
            suggested_account_code: { type: string, nullable: true }
            candidates:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  score: { type: number }
            transaction_date: { type: string, format: date, nullable: true }
            amount: { type: number, nullable: true }
            vendor_name: { type: string, nullable: true }
            invoice_registration_number: { type: string, nullable: true }
            suggested_account_id: { type: string, format: uuid, nullable: true }
        confidence_score: { type: number, minimum: 0, maximum: 1, nullable: true }
        model_name: { type: string }
        provider: { type: string, description: "AIプロバイダ名 (rule_engine, anthropic, openai等)" }
        accepted: { type: boolean, nullable: true, description: "NULL=未判定" }
        created_at: { type: string, format: date-time }
    AiSuggestionResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/AiSuggestion" }
        meta: { $ref: "#/components/schemas/Meta" }
    AiSuggestionListResponse:
      type: object
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/AiSuggestion" }
        meta: { $ref: "#/components/schemas/Meta" }

    # ---- Contracts (Phase 1: 総務・法務) ----
    Contract:
      type: object
      required:
        - id
        - contract_no
        - title
        - counterparty_name
        - contract_type
        - currency
        - start_date
        - auto_renewal
        - renewal_notice_days
        - status
        - created_by
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid, readOnly: true }
        contract_no: { type: string, description: "契約書管理番号 (CNT-YYYY-NNNN)" }
        title: { type: string, description: "契約書件名・タイトル" }
        counterparty_name: { type: string, description: "相手先企業/個人名" }
        contract_type: { $ref: "#/components/schemas/ContractType" }
        contract_amount: { type: number, nullable: true, description: "契約金額 (NDA等の場合はnull)" }
        currency: { type: string, minLength: 3, maxLength: 3, default: "JPY" }
        start_date: { type: string, format: date, description: "契約開始日" }
        end_date: { type: string, format: date, nullable: true, description: "契約満了日 (定めのない場合はnull)" }
        auto_renewal: { type: boolean, default: false, description: "自動更新条項の有無" }
        renewal_notice_days: { type: integer, default: 30, description: "更新拒絶/解約申入期限(日前)" }
        status: { $ref: "#/components/schemas/ContractStatus" }
        attachment_id: { type: string, format: uuid, nullable: true, description: "添付された契約書PDFのID" }
        source_suggestion_id: { type: string, format: uuid, nullable: true, description: "起草元となったAI条項抽出提案のID" }
        description: { type: string, nullable: true, description: "契約概要・特記事項" }
        approved_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    ContractDetail:
      allOf:
        - $ref: "#/components/schemas/Contract"
        - type: object
          required: [approval_history]
          properties:
            attachment:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                file_name: { type: string }
                mime_type: { type: string }
                document_category: { type: string }
            approval_history:
              type: array
              items: { $ref: "#/components/schemas/ApprovalHistoryEntry" }

    ContractCreate:
      type: object
      required:
        - title
        - counterparty_name
        - contract_type
        - start_date
      properties:
        title: { type: string }
        counterparty_name: { type: string }
        contract_type: { $ref: "#/components/schemas/ContractType" }
        contract_amount: { type: number, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3, default: "JPY" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        auto_renewal: { type: boolean, default: false }
        renewal_notice_days: { type: integer, default: 30 }
        attachment_id: { type: string, format: uuid, nullable: true }
        source_suggestion_id: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true }

    ContractUpdate:
      type: object
      properties:
        title: { type: string }
        counterparty_name: { type: string }
        contract_type: { $ref: "#/components/schemas/ContractType" }
        contract_amount: { type: number, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        auto_renewal: { type: boolean }
        renewal_notice_days: { type: integer }
        attachment_id: { type: string, format: uuid, nullable: true }
        source_suggestion_id: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true }

    ContractResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/Contract" }
        meta: { $ref: "#/components/schemas/Meta" }

    ContractDetailResponse:
      type: object
      properties:
        success: { const: true }
        data: { $ref: "#/components/schemas/ContractDetail" }
        meta: { $ref: "#/components/schemas/Meta" }

    ContractListResponse:
      type: object
      properties:
        success: { const: true }
        data:
          type: array
          items: { $ref: "#/components/schemas/Contract" }
        meta: { $ref: "#/components/schemas/Meta" }
