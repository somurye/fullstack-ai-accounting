      summary: 発行済み請求書に対する訂正(クレジットノート)を起票する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: number }
                reason: { type: string }
      responses:
        "201":
          description: クレジットノート作成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditNoteResponse" }

  /invoices/{id}/payments:
    get:
      tags: [Invoices]
      summary: 請求書に対する入金消込履歴を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 入金消込一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentListResponse" }
    post:
      tags: [Invoices]
      summary: 売掛金の入金消込を手動で記録する(一部入金・過入金に対応)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_date, amount]
              properties:
                payment_date: { type: string, format: date }
                amount: { type: number }
                bank_transaction_id: { type: string, format: uuid }
      responses:
        "201":
          description: |
            消込成功。全額消込の場合 invoice.status=paid、
            一部消込の場合は partially_paid へ遷移する。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePaymentResponse" }

