        - name: due_date_from
          in: query
          schema: { type: string, format: date }
        - name: due_date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 売上請求書一覧
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceListResponse" }
    post:
      tags: [Invoices]
      summary: 売上請求書を草案(draft)として作成する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceCreate" }
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResponse" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: 売上請求書詳細(明細含む)を取得する
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      responses:
        "200":
          description: 売上請求書詳細
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Invoices]
      summary: 売上請求書を編集する(draft状態のみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceCreate" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /invoices/{id}/issue:
    post:
      tags: [Invoices]
      summary: 売上請求書を発行する(売上計上仕訳を自動起票し、以後は追記専用化)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 発行成功(status=issued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /invoices/{id}/void:
    post:
      tags: [Invoices]
      summary: 売上請求書を取消す(発行後24時間以内かつ未入金の場合のみ)
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdPathParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceResponse" }
        "409": { $ref: "#/components/responses/Conflict" }

  /invoices/{id}/credit-notes:
    post:
